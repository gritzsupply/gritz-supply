<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>GRITZ SUPPLY</title>
  <link rel="icon" href="assets/gritz-logo.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101010;
    }

    #gritzApp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #101010;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #101010;
      color: #f2f2f2;
      font: 600 14px Inter, Arial, sans-serif;
      z-index: 2;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Memuat GRITZ SUPPLY...</div>

  <iframe
    id="gritzApp"
    src="https://script.google.com/macros/s/AKfycbxjJKOGx04RhkA-G9JPVwycbdrA14VZ31BGh7LMTZ4zmwl95QNQRlE77AklFlSWZsd1aQ/exec"
    title="GRITZ SUPPLY"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const frame = document.getElementById('gritzApp');
    frame.addEventListener('load', () => {
      document.getElementById('loading').classList.add('hidden');
    });
  </script>
</body>
</html>
